research_task:
  description: >
    Conduct a thorough research about {topic}
    Make sure you find any interesting and relevant information given
    the current year is {current_year}.
  expected_output: >
    A list with 10 bullet points of the most relevant information about {topic}
  agent: researcher

reporting_task:
  description: >
    Review the context you got and expand each topic into a full section for a report.
    Make sure the report is detailed and contains any and all relevant information.
  expected_output: >
    A fully fledged report with the main topics, each with a full section of information.
    Formatted as markdown without '```'
  agent: reporting_analyst

deep_research_task:
  description: >
    Execute a structured research process using the Deep Research Tool. Gather relevant context and memories, analyze and reason over them iteratively, identify gaps or assumptions, and synthesize findings into a comprehensive Markdown research plan.
  expected_output: >
    A well-structured Markdown document including problem analysis, technical approach, design decisions, trade-offs, risks, and a detailed implementation roadmap.
  agent: deep_researcher
  tool: DeepResearchTool
