planning_task:
  description: >
    Perform deep research on the following software requirement before drafting
    any implementation guidance.
    
    REQUIREMENT:
    {requirement}
    
    Follow a structured research process:
    1. Gather all relevant context, notes, and memories available for the requirement.
    2. Analyze the problem iteratively and reason over the evidence.
    3. Identify gaps, ambiguities, constraints, and assumptions.
    4. Synthesize the findings into a clear Markdown research plan.
    
    Your output MUST be a .md document and MUST include the following sections:
    - Problem analysis
    - Technical approach
    - Design decisions
    - Trade-offs
    - Risks
    - Assumptions/Gaps
    - Detailed implementation roadmap
    
    Write the document so it can be reviewed and used as the foundation for
    downstream code generation.
    
  expected_output: >
    A well-structured Markdown (.md) research plan anchored to {requirement},
    containing the required sections for analysis, synthesis, and implementation
    planning.
  agent: architect

