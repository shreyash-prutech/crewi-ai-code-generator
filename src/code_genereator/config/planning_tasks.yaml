planning_task:
  description: >
    Analyze the user's software requirement and create a comprehensive technical
    specification for the engineering crew. The specification should include the
    system architecture, data model, backend API design, frontend requirements,
    integration points, implementation plan, and key risks.

    User requirement:
    {requirement}
  expected_output: >
    A detailed JSON-like technical specification that the engineering crew can
    use to implement the complete software project.
  agent: architect
  async_execution: true

technical_feasibility_research_task:
  description: >
    Research the technical feasibility of the user's software requirement to
    support planning. Evaluate implementation complexity, technology constraints,
    dependency risks, integration concerns, scalability considerations, security
    implications, and any areas requiring validation before engineering begins.
    This task is intended to run in parallel with planning_task rather than as a
    sequential follow-up.

    User requirement:
    {requirement}
  expected_output: >
    A technical feasibility research report summarizing feasible implementation
    approaches, major risks, constraints, recommended technologies, assumptions,
    and planning considerations.
  agent: Deepresarch
  async_execution: true
